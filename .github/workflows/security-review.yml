name: Backend Security Audit & Dependency Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep Static Scanner
        run: |
          pip install semgrep
          semgrep --config=auto backend/ || echo "Semgrep completed scanning"

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install openpyxl

      - name: Run API & Performance Tests
        run: |
          python automation/utils/generate_vulnerability_reports.py

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: Vulnerability Test Results/
          retention-days: 30
