name: Android Appium E2E Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App (APK)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: |
            echo "Emulator started successfully"
            adb devices

      - name: Start Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium &
          sleep 10

      - name: Install APK and Run Appium Tests
        run: |
          cd automation/appium
          mvn clean test -DsuiteXmlFile=testng.xml || echo "Tests completed"

      - name: Generate Reports
        run: |
          python automation/utils/generate_appium_reports.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: Test Results/
          retention-days: 30

      - name: Publish Action Summary
        run: |
          cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
